# Phase 14 — TAKATAK V1 CI. No secrets, no live DB, no seed, no deploy.
name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (lockfile)
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm run db:generate

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Secret scan
        run: pnpm run qa:secrets

      - name: Access-control matrix (pure logic, no DB)
        run: pnpm run qa:access

      - name: Readiness report (static, no secrets)
        run: pnpm run qa:readiness
