# TAKATAK V1 CI. Ephemeral local Supabase only. No hosted project, no deploy.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - fix/auth-identity-deployment-hardening
  workflow_dispatch:

jobs:
  linux-quality-and-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
      CHECK_GIT_TRACKED: "1"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-not-a-secret
      DATABASE_URL: postgresql://127.0.0.1:1/ci
      DIRECT_URL: postgresql://127.0.0.1:1/ci
      SUPABASE_SECRET_KEY: ci-secret-key-not-a-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22.23.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.23.2
          cache: npm

      - name: Clean install (lockfile)
        run: |
          npm ci --ignore-scripts=false
          git diff --exit-code -- package-lock.json

      - name: Prisma generate
        run: npm run db:generate

      - name: Required source files are tracked
        run: npm run check:sources

      - name: Static RLS checks
        run: npm run qa:rls:static

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Authentication tests
        run: npm run test:auth

      - name: Identity-isolation tests
        run: npm run test:identity

      - name: Access-control matrix (pure logic, no DB)
        run: npm run qa:access

      - name: Secret scan
        run: npm run qa:secrets

      - name: Readiness report (static, no secrets)
        run: npm run qa:readiness

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Show pinned Supabase CLI version
        run: supabase --version

      - name: Start ephemeral local Supabase
        run: supabase start

      - name: Export ephemeral Supabase env
        run: |
          eval "$(supabase status -o env)"
          ANON="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          SERVICE="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          {
            echo "EPHEMERAL_SUPABASE=1"
            echo "OTP_MEMORY_PATH=/tmp/takatak-otp-memory.json"
            echo "EPHEMERAL_SEED_PATH=/tmp/takatak-ephemeral-seed.json"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE"
            echo "SUPABASE_SECRET_KEY=$SERVICE"
            echo "DATABASE_URL=$DB_URL"
            echo "DIRECT_URL=$DB_URL"
          } >> "$GITHUB_ENV"

      - name: Fail if hosted Supabase leaked into ephemeral env
        run: node scripts/ci-fail-if-hosted-supabase.cjs

      - name: Apply Prisma migrations (never db push)
        run: |
          npx prisma migrate status
          npx prisma migrate deploy
          npx prisma migrate status
          if grep -R "pcjfahhlozsseqqevimi" supabase prisma/migrations >/dev/null 2>&1; then
            echo "hosted project ref must not appear in ephemeral SQL"
            exit 1
          fi

      - name: Seed synthetic Auth identities
        run: npm run qa:ephemeral-seed

      - name: Live RLS + PostgREST checks
        run: npm run qa:rls

      - name: Security Advisor catalog equivalent
        run: npm run qa:rls:advisor

      - name: Application-flow tests (memory OTP adapter)
        env:
          OTP_EMAIL_ADAPTER: memory
        run: npm run qa:ephemeral-app-flow

      - name: Prisma tenant-isolation tests
        run: npm run qa:tenant-isolation

      - name: Build (webpack)
        run: npm run build

      - name: Hashed external detection and compiled-module loading
        run: npm run check:modules

      - name: Pack Linux production artifact
        run: npm run artifact:pack
        env:
          TAKATAK_BUILD_ID: ci-${{ github.sha }}

      - name: Artifact content audit
        run: node scripts/audit-production-artifact.cjs var/artifacts/ci-${{ github.sha }}

      - name: Clean artifact startup
        run: node scripts/artifact-startup-smoke.cjs var/artifacts/ci-${{ github.sha }}/takatak-ci-${{ github.sha }}.tar.gz

      - name: Upload CI tarball
        uses: actions/upload-artifact@v4
        with:
          name: takatak-ci-${{ github.sha }}
          path: |
            var/artifacts/ci-${{ github.sha }}/takatak-ci-${{ github.sha }}.tar.gz
            var/artifacts/ci-${{ github.sha }}/takatak-ci-${{ github.sha }}.tar.gz.sha256
            var/artifacts/ci-${{ github.sha }}/build-metadata.json
          if-no-files-found: error
