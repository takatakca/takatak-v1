name: Domain renewal notices (read-only)

on:
  pull_request:
    paths:
      - 'src/lib/web-hosting/domain-renewal-notices.ts'
      - 'src/app/dashboard/web-hosting/domains/page.tsx'
      - 'src/components/web-hosting/domains-manager.tsx'
      - 'scripts/verify-domain-renewal-notices.ts'
      - 'package.json'
      - '.github/workflows/domain-renewal-notices.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renewal-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run qa:domain-renewals
