name: KnowledgeAI Issuer Contract CI

on:
  pull_request:
    paths:
      - "prisma/**"
      - "src/lib/integrations/knowledgeai/**"
      - "src/app/api/integrations/knowledgeai/**"
      - "src/lib/security/authenticated-identity.ts"
      - "scripts/knowledgeai-issuer-tests.ts"
      - ".github/workflows/knowledgeai-issuer-ci.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  issuer-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install application dependencies
        run: npm ci --ignore-scripts=false
      - name: Generate Prisma schema
        run: npm run db:generate
      - name: Validate central KnowledgeAI signer and access gates
        run: npm run qa:knowledgeai-issuer
      - name: Typecheck shared server integration
        run: npm run typecheck
