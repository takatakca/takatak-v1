name: Legacy domain 30-day renewal notice preview
on:
  pull_request:
    paths:
      - 'src/lib/web-migration/legacy-domain-renewal-preview.ts'
      - 'scripts/verify-legacy-domain-renewal-preview.ts'
      - 'package.json'
      - '.github/workflows/legacy-domain-renewal-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run qa:legacy-renewal-preview
