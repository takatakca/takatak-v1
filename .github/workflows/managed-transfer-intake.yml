name: Managed transfer intake (read-only quote)

on:
  pull_request:
    paths:
      - 'src/lib/web-migration/managed-transfer-intake.ts'
      - 'src/components/website/transfer/LegacyTransferRequestForm.tsx'
      - 'scripts/verify-managed-transfer-intake.ts'
      - 'package.json'
      - '.github/workflows/managed-transfer-intake.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed-transfer-request:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run qa:managed-transfer-intake
