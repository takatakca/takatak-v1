name: Preview TAKATAK auth branch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    env:
      STAGING_SUPABASE_URL: https://utuvzrqvivqyziibobvu.supabase.co
      STAGING_SUPABASE_REF: utuvzrqvivqyziibobvu

    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4

      - name: Require an isolated preview target
        id: target
        env:
          PREVIEW_URL: ${{ vars.TAKATAK_PREVIEW_APP_URL }}
          STAGING_URL: ${{ vars.TAKATAK_STAGING_APP_URL }}
          PREVIEW_ROOT: ${{ secrets.TAKATAK_PREVIEW_APP_ROOT }}
          STAGING_ROOT: ${{ secrets.TAKATAK_STAGING_APP_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PREVIEW_URL:-}" ] || [ -z "${PREVIEW_ROOT:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No isolated preview URL or app root is configured."
            echo "The main staging site was not changed."
            exit 0
          fi
          if [ "$PREVIEW_URL" = "https://takatak.ca" ] || [ "$PREVIEW_URL" = "${STAGING_URL:-}" ]; then
            echo "ERROR: preview URL must be separate from production and the current staging site."
            exit 1
          fi
          if [ "$PREVIEW_ROOT" = "${STAGING_ROOT:-}" ]; then
            echo "ERROR: preview app root must not be the current staging app root."
            exit 1
          fi
          [[ "$PREVIEW_URL" =~ ^https://[^/]+$ ]] || {
            echo "ERROR: preview URL must be an HTTPS origin."
            exit 1
          }
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Report missing preview host
        if: steps.target.outputs.ready != 'true'
        run: |
          echo "Preview deployment is blocked until TAKATAK_PREVIEW_APP_URL and TAKATAK_PREVIEW_APP_ROOT exist."
          echo "Those values must differ from the live staging site. Production and the main staging workflow were not modified."

      - name: Setup Node.js
        if: steps.target.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.x
          cache: npm

      - name: Install dependencies
        if: steps.target.outputs.ready == 'true'
        run: npm ci

      - name: Build staging-configured preview
        if: steps.target.outputs.ready == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://utuvzrqvivqyziibobvu.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TAKATAK_STAGING_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ vars.TAKATAK_PREVIEW_APP_URL }}
        run: |
          set -euo pipefail
          if [ "$NEXT_PUBLIC_APP_URL" = "https://takatak.ca" ]; then
            echo "ERROR: refusing production URL."
            exit 1
          fi
          case "$NEXT_PUBLIC_SUPABASE_URL" in
            *utuvzrqvivqyziibobvu*) ;;
            *) echo "ERROR: preview build is not pinned to staging Supabase."; exit 1 ;;
          esac
          npm run build
