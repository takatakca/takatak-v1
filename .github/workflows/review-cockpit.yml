name: REVEW cockpit checks
on:
  push:
    branches: [codex/review-ecosystem, codex/review-premium-ready]
  pull_request:
    paths:
      - "src/lib/reputation/**"
      - "src/components/reputation/**"
      - "src/components/brand/brand-hero-backdrop.tsx"
      - "src/components/website/home/HomeHero.tsx"
      - "src/lib/qmaps/**"
      - "src/app/api/reputation/**"
      - "src/app/api/ai/reviews/**"
      - "src/app/dashboard/growth/ai-engine/actions.ts"
      - "src/lib/ai-agents/service.ts"
      - "src/lib/integrations/google-business/service.ts"
      - "src/app/dashboard/growth/reviews/**"
      - "src/app/dashboard/local-listings/reviews/**"
      - "scripts/review-cockpit-tests.ts"
      - "scripts/review-approval-tests.ts"
      - "scripts/review-draft-edit-tests.ts"
      - "scripts/review-draft-action-tests.ts"
      - "scripts/review-generation-tests.ts"
      - "scripts/review-generation-action-tests.ts"
      - "scripts/review-native-publication-tests.ts"
      - "scripts/review-workspace-navigation-tests.ts"
      - "scripts/review-publisher-tests.ts"
      - "scripts/review-google-publication-tests.ts"
      - "scripts/review-qmaps-api-tests.ts"
      - "scripts/review-qmaps-contract-tests.ts"
      - "scripts/review-qmaps-visibility-tests.ts"
      - "scripts/review-agent-tools-tests.ts"
      - "src/app/(website)/reviews/**"
      - "next.config.ts"
      - "src/lib/security/https-redirect.ts"
      - "scripts/review-import-tests.ts"
      - "scripts/review-import-service-tests.ts"
      - ".github/workflows/review-cockpit.yml"
permissions:
  contents: read
concurrency:
  group: review-cockpit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-not-a-secret
      DATABASE_URL: postgresql://127.0.0.1:1/ci
      DIRECT_URL: postgresql://127.0.0.1:1/ci
      SUPABASE_SECRET_KEY: ci-secret-key-not-a-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts=false
      - run: npm run db:generate
      - run: npm run qa:review-cockpit
      - run: npm run qa:review-approval
      - run: npm run qa:review-draft-edit
      - run: npm run qa:review-draft-actions
      - run: npm run qa:review-generation
      - run: npm run qa:review-generation-actions
      - run: npm run qa:review-native-publication
      - run: npm run qa:review-workspace-navigation
      - run: npm run qa:review-publisher
      - run: npm run qa:review-google-publication
      - run: npm run qa:review-qmaps-api
      - run: npm run qa:review-qmaps-visibility
      - name: Fetch exact QMAPS counterpart contract
        shell: bash
        run: |
          git init "$RUNNER_TEMP/revew-qmaps-contract"
          git -C "$RUNNER_TEMP/revew-qmaps-contract" fetch --depth=1 https://github.com/takatakca/qmaps.git 9a7403336a6e6aa4244c126630fe0460668ade8d
          git -C "$RUNNER_TEMP/revew-qmaps-contract" checkout --detach FETCH_HEAD
      - run: npm run qa:review-qmaps-contract
        env:
          REVEW_QMAPS_CHECKOUT: ${{ runner.temp }}/revew-qmaps-contract
      - run: npm run qa:review-agent-tools
      - run: npm run qa:review-import-model
      - run: npm run qa:review-import-service
      - run: npm run qa:qmaps-bridge
      - run: npm run qa:qmaps-sync
      - run: npm run typecheck
      - name: Lint changed review boundaries
        run: npx eslint next.config.ts src/lib/security/https-redirect.ts "src/app/(website)/reviews" src/components/brand/brand-hero-backdrop.tsx src/components/website/home/HomeHero.tsx src/lib/reputation src/components/reputation src/app/api/reputation src/app/dashboard/growth/reviews src/app/dashboard/local-listings/reviews src/components/local-listings/qmaps-reply-form.tsx src/lib/qmaps src/app/api/ai/reviews src/app/dashboard/growth/ai-engine/actions.ts src/lib/ai-agents/service.ts src/lib/integrations/google-business/service.ts scripts/review-cockpit-tests.ts
      - name: Build (webpack)
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee "$RUNNER_TEMP/revew-build.log"
          build_status=${PIPESTATUS[0]}
          set -e
          if [ "$build_status" -ne 0 ]; then
            if grep -Eqi 'Failed to (fetch|download).*font|next/font.*(error|failed)|fonts.googleapis.com' "$RUNNER_TEMP/revew-build.log"; then
              echo "::error title=Production build diagnostic::External font download errors were detected in the build output."
            elif grep -Eqi 'Error occurred prerendering|prerender-error' "$RUNNER_TEMP/revew-build.log"; then
              echo "::error title=Production build diagnostic::A prerendering error was detected in the build output."
            elif grep -Eqi 'Module not found|MODULE_NOT_FOUND|Cannot find module|Can.t resolve' "$RUNNER_TEMP/revew-build.log"; then
              echo "::error title=Production build diagnostic::A module resolution error was detected in the build output."
            elif grep -Eqi 'Type error:|error TS[0-9]{4}' "$RUNNER_TEMP/revew-build.log"; then
              echo "::error title=Production build diagnostic::A type error was detected in the build output."
            elif grep -Eqi '(missing|required|not configured).*(NEXT_PUBLIC|SUPABASE|DATABASE_URL)|(NEXT_PUBLIC|SUPABASE|DATABASE_URL).*(missing|required|not configured)' "$RUNNER_TEMP/revew-build.log"; then
              echo "::error title=Production build diagnostic::A required runtime or public configuration error was detected in the build output."
            else
              echo "::error title=Production build diagnostic::The build failed outside the recognized diagnostic categories; authenticated logs are required."
            fi
          fi
          exit "$build_status"
