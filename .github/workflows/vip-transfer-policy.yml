name: VIP Transfer AI contract
on:
  pull_request:
    paths:
      - "src/lib/web-migration/vip-transfer-policy.ts"
      - "scripts/verify-vip-transfer-policy.ts"
      - ".github/workflows/vip-transfer-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install from locked dependencies
        run: npm ci --ignore-scripts
      - name: Test migration permissions and VIP pricing without external services
        run: npx --no-install tsx scripts/verify-vip-transfer-policy.ts
