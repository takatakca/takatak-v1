services:
  monitor:
    build: .
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 32
    env_file: .env
    volumes:
      - monitor-data:/data
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
volumes:
  monitor-data:
